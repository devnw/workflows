name: Benchmark

on:
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false 
      GH_ACCESS_TOKEN:
        required: true 
      GORELEASER_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      GOPRIVATE:
        required: false
      FONTAWESOME_TOKEN:
        required: false

permissions:
  contents: write

env:
  GOPRIVATE: ${{ vars.GOPRIVATE }}
  GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
  GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
  FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}

jobs:
  release:
    name: Make Benchmark
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
      - uses: devnw/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Benchmark
        run: make bench-ci

      - name: Detect benchmark output
        if: ${{ always() }}
        id: check-bench
        run: |
          if [[ -s bench-output.txt ]]; then
            echo "has_bench=true" >> "$GITHUB_OUTPUT"
            echo "file=bench-output.txt" >> "$GITHUB_OUTPUT"
          elif [[ -s output.txt ]]; then
            echo "has_bench=true" >> "$GITHUB_OUTPUT"
            echo "file=output.txt" >> "$GITHUB_OUTPUT"
          else
            echo "has_bench=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug benchmark detection
        if: ${{ always() }}
        run: echo "has_bench=${{ steps.check-bench.outputs.has_bench }} file=${{ steps.check-bench.outputs.file }}"

      - name: Store benchmark result
        if: ${{ always() && steps.check-bench.outputs.has_bench == 'true' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmark Results
          tool: 'go'
          output-file-path: ${{ steps.check-bench.outputs.file }}
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '${{ vars.ALERT_CC_USERS }}'
