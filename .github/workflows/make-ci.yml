name: Make CI/CD

on:
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: false
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false 
      GH_ACCESS_TOKEN:
        required: false 
      GORELEASER_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      GOPRIVATE:
        required: false
      FONTAWESOME_TOKEN:
        required: false
      DOCS_LOCATION:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false
      COMPASS_API_KEY:
        required: false
      COMPASS_USER:
        required: false
      COMPASS_USER_EMAIL:
        required: false
      REPO_RW_PAT:
        required: false 

env:
  GOPRIVATE: ${{ vars.GOPRIVATE }}
  GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
  GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
  FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
  DOCS_LOCATION: ${{ secrets.DOCS_LOCATION }}
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  COMPASS_API_KEY: ${{ secrets.COMPASS_API_KEY }}
  COMPASS_USER: ${{ secrets.COMPASS_USER }}
  COMPASS_USER_EMAIL: ${{ secrets.COMPASS_USER_EMAIL }}
  REPO_RW_PAT: ${{ secrets.REPO_RW_PAT }}

permissions:
  contents: write
  deployments: write
  packages: write
  pages: write

jobs:
  build:
    name: Lint, Build, Test, Benchmark
    if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
    uses: devnw/workflows/.github/workflows/nix.yml@main
    with:
      job: build
      command: make bench-ci
    secrets: inherit # pragma: allowlist secret

  release:
    name: Lint, Build, Test, Benchmark and Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: devnw/workflows/.github/workflows/nix.yml@main
    with:
      job: release
      command: make release-ci
    secrets: inherit # pragma: allowlist secret
