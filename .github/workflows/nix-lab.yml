on:
  workflow_call:
    inputs:
      job:
        required: true
        type: string
      command:
        required: true
        type: string
jobs:
  job:
    name: "${{ inputs.job }}"
    runs-on: nixos
    permissions:
      contents: write
      deployments: write
      packages: write
      pages: write
    
    env:
      GOPRIVATE: ${{ vars.GOPRIVATE }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: de-vri-es/setup-git-credentials@v2
        with:
          credentials: ${{secrets.GIT_CREDENTIALS}}

      - name: "${{ inputs.job }}"
        run: nix develop --command ${{ inputs.command }}

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: coverage
          path: coverage.txt

      - name: Upload Fuzz Results
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: fuzz-results
          path: testdata/fuzz
