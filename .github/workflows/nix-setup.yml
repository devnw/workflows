on:
  workflow_call:
    inputs:
      depth:
        required: false
        type: number
        default: 0
      cache-name:
        required: false
        type: string
        default: oss-devnw
      upstream-cache:
        required: false
        type: string
        default: https://oss-devnw.cachix.org
      nix-args:
        required: false
        type: string
        default: '--impure --accept-flake-config'
      tailnet:
        required: false
        type: boolean
        default: false
    secrets:
      GIT_CREDENTIALS:
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false
      GH_ACCESS_TOKEN:
        required: true
      GORELEASER_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      FONTAWESOME_TOKEN:
        required: false
      DOCS_LOCATION:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: false
      COMPASS_API_KEY:
        required: false
      COMPASS_USER:
        required: false
      COMPASS_USER_EMAIL:
        required: false
      REPO_RW_PAT:
        required: false

jobs:
  job:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    permissions:
      contents: write
      deployments: write
      packages: write
      pages: write

    env:
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      DOCS_LOCATION: ${{ secrets.DOCS_LOCATION }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COMPASS_API_KEY: ${{ secrets.COMPASS_API_KEY }}
      COMPASS_USER: ${{ secrets.COMPASS_USER }}
      COMPASS_USER_EMAIL: ${{ secrets.COMPASS_USER_EMAIL }}
      REPO_RW_PAT: ${{ secrets.REPO_RW_PAT }}
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

    steps:
      # Use the composite action
      - name: Setup Nix Environment
        uses: ./.github/actions/nix-setup
        with:
          depth: ${{ inputs.depth }}
          cache-name: ${{ inputs.cache-name }}
          upstream-cache: ${{ inputs.upstream-cache }}
          nix-args: ${{ inputs.nix-args }}
          tailnet: ${{ inputs.tailnet }}
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          goreleaser-key: ${{ secrets.GORELEASER_KEY }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          fontawesome-token: ${{ secrets.FONTAWESOME_TOKEN }}
          docs-location: ${{ secrets.DOCS_LOCATION }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
